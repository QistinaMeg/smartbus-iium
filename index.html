<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBus IIUM - Live Transit Tracking</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Firebase v9 Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100vw;
      z-index: 1;
    }

    /* Top Overlay Header */
    .header-overlay {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 450px;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand h1 {
      font-size: 1.1rem;
      color: #1e293b;
      font-weight: 700;
    }

    .status-badge {
      font-size: 0.75rem;
      background: #e2e8f0;
      color: #475569;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* Bottom Control Panel */
    .control-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #ffffff;
      width: 90%;
      max-width: 450px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    .filter-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #1e293b;
      outline: none;
      background-color: #f8fafc;
      cursor: pointer;
    }

    select:focus {
      border-color: #2563eb;
    }

    .bus-list {
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bus-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #f1f5f9;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .bus-card:hover {
      background: #e2e8f0;
    }

    .bus-info .bus-title {
      font-weight: 600;
      color: #0f172a;
      font-size: 0.9rem;
    }

    .bus-info .bus-sub {
      font-size: 0.75rem;
      color: #64748b;
    }

    .bus-speed {
      font-size: 0.85rem;
      font-weight: 700;
      color: #16a34a;
    }

    .empty-state {
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      padding: 10px 0;
    }

    /* Custom Leaflet Markers */
    .bus-marker-icon {
      background: #2563eb;
      border: 2px solid #ffffff;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .station-marker-icon {
      background: #ffffff;
      border: 2px solid #2563eb;
      border-radius: 50%;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <!-- Top Banner Overlay -->
  <div class="header-overlay">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="18" height="12" rx="2" />
        <circle cx="7" cy="18" r="2" />
        <circle cx="17" cy="18" r="2" />
        <line x1="3" y1="11" x2="21" y2="11" />
      </svg>
      <h1>SmartBus IIUM</h1>
    </div>
    <div class="status-badge" id="active-count">0 Active Buses</div>
  </div>

  <!-- Interactive Map View -->
  <div id="map"></div>

  <!-- Route Filter & Active Bus Panel -->
  <div class="control-panel">
    <div class="filter-group">
      <label for="route-select">Filter Route / Terminal:</label>
      <select id="route-select">
        <option value="ALL">All Routes</option>
        <option value="Ruqayyah">Ruqayyah Terminal (Main Loop)</option>
        <option value="Salahuddin" disabled>Salahuddin Terminal (Disabled)</option>
      </select>
    </div>

    <div class="bus-list" id="bus-list-container">
      <div class="empty-state">Loading live bus updates...</div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // -----------------------------------------------------------------
    // 1. Firebase Initialization
    // -----------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // -----------------------------------------------------------------
    // 2. Leaflet Map Centered at IIUM Gombak
    // -----------------------------------------------------------------
    const IIUM_GOMBAK_COORDS = [3.2520, 101.7345];
    const map = L.map('map', { zoomControl: false }).setView(IIUM_GOMBAK_COORDS, 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    const busMarkers = {};
    const stationMarkers = {};
    let currentBusesData = [];

    // Helper: Distance calculation (Haversine Formula in meters)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }

    // SVG Marker Icons
    function createBusIcon() {
      return L.divIcon({
        className: 'custom-bus-marker',
        html: `
          <div class="bus-marker-icon" style="width:36px; height:36px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="12" rx="2" />
              <circle cx="7" cy="18" r="2" />
              <circle cx="17" cy="18" r="2" />
              <line x1="3" y1="11" x2="21" y2="11" />
            </svg>
          </div>
        `,
        iconSize: [36, 36],
        iconAnchor: [18, 18]
      });
    }

    function createStationIcon() {
      return L.divIcon({
        className: 'custom-station-marker',
        html: `
          <div class="station-marker-icon" style="width:28px; height:28px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }

    // -----------------------------------------------------------------
    // 3. Station Popup Content Generator (No Calc Speed, ETA on Physical Movement)
    // -----------------------------------------------------------------
    function getStationPopupContent(station, nearestBus) {
      if (!nearestBus) {
        return `
          <div style="font-family: sans-serif; font-size: 0.9rem; line-height: 1.4;">
            <strong style="font-size: 1rem; color: #0f172a;">${station.name}</strong><br>
            <span style="color: #64748b;">No active buses on route</span>
          </div>
        `;
      }

      const busSpeed = nearestBus.speedKmH || 0;
      const distanceMeters = calculateDistance(nearestBus.lat, nearestBus.lng, station.lat, station.lng);
      let etaStatusText = "";

      // ETA starts ONLY if bus has physically moved (> 2 km/h)
      if (busSpeed < 2) {
        etaStatusText = `<strong>Status:</strong> Stationary at terminal`;
      } else {
        const speedInMetersPerMin = (busSpeed * 1000) / 60;
        const etaMinutes = Math.max(1, Math.round(distanceMeters / speedInMetersPerMin));
        etaStatusText = `<strong>Status:</strong> ETA: <strong>${etaMinutes} mins</strong> (${Math.round(distanceMeters)}m via road)`;
      }

      return `
        <div style="font-family: sans-serif; line-height: 1.5;">
          <strong style="font-size: 1rem; color: #0f172a;">${station.name}</strong><br>
          <span style="color: #475569;">Next Bus: <strong>${nearestBus.name}</strong></span><br>
          ${etaStatusText}<br>
          <span>Stops Remaining: <strong>${station.stopsRemaining || 1}</strong></span><br>
          <span>Occupancy: <strong>${nearestBus.occupancy || 'Normal'}</strong></span>
          
          <div style="margin-top: 8px;">
            <a href="https://www.google.com/maps/search/?api=1&query=${station.lat},${station.lng}" 
               target="_blank" 
               style="display: inline-block; padding: 4px 10px; background: #f1f5f9; color: #2563eb; text-decoration: none; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.8rem; font-weight: 600;">
              ℹ View Stop on Google Maps
            </a>
          </div>
        </div>
      `;
    }

    // -----------------------------------------------------------------
    // 4. Real-time Firestore Listener
    // -----------------------------------------------------------------
    db.collection("buses").onSnapshot((snapshot) => {
      currentBusesData = [];
      const updatedDocIds = new Set();

      snapshot.forEach((doc) => {
        const data = doc.data();
        const docId = doc.id;
        
        currentBusesData.push({ id: docId, ...data });
        updatedDocIds.add(docId);

        const lat = data.lat || 3.2520;
        const lng = data.lng || 101.7345;
        const busName = data.name || "IIUM Shuttle";
        const speed = data.speedKmH !== undefined ? data.speedKmH : 0;
        const terminal = data.startTerminal || "Ruqayyah";

        // Update bus markers on map
        if (busMarkers[docId]) {
          busMarkers[docId].setLatLng([lat, lng]);
          busMarkers[docId].getPopup().setContent(`
            <strong>${busName}</strong><br>
            Terminal: ${terminal}<br>
            Speed: ${speed} km/h
          `);
        } else {
          const marker = L.marker([lat, lng], { icon: createBusIcon() }).addTo(map);
          marker.bindPopup(`
            <strong>${busName}</strong><br>
            Terminal: ${terminal}<br>
            Speed: ${speed} km/h
          `);
          busMarkers[docId] = marker;
        }
      });

      // Cleanup inactive bus markers
      Object.keys(busMarkers).forEach((docId) => {
        if (!updatedDocIds.has(docId)) {
          map.removeLayer(busMarkers[docId]);
          delete busMarkers[docId];
        }
      });

      renderBusList();
      updateStationPopups();
    }, (error) => {
      console.error("Firestore Listener Error: ", error);
    });

    // Dynamic Station Popup Refreshes
    function updateStationPopups() {
      // Find primary active bus (if any)
      const primaryBus = currentBusesData.length > 0 ? currentBusesData[0] : null;

      Object.keys(stationMarkers).forEach(stationKey => {
        const stationObj = stationMarkers[stationKey].stationData;
        const popupContent = getStationPopupContent(stationObj, primaryBus);
        stationMarkers[stationKey].marker.getPopup().setContent(popupContent);
      });
    }

    // -----------------------------------------------------------------
    // 5. UI List Rendering & Filtering
    // -----------------------------------------------------------------
    const routeSelect = document.getElementById("route-select");
    const busListContainer = document.getElementById("bus-list-container");
    const activeCountBadge = document.getElementById("active-count");

    routeSelect.addEventListener("change", renderBusList);

    function renderBusList() {
      const selectedFilter = routeSelect.value;
      
      const filteredBuses = currentBusesData.filter((bus) => {
        if (selectedFilter === "ALL") return true;
        return bus.startTerminal === selectedFilter;
      });

      activeCountBadge.innerText = `${filteredBuses.length} Active Bus${filteredBuses.length === 1 ? '' : 'es'}`;
      busListContainer.innerHTML = "";

      if (filteredBuses.length === 0) {
        busListContainer.innerHTML = `<div class="empty-state">No active buses on this route currently.</div>`;
        return;
      }

      filteredBuses.forEach((bus) => {
        const card = document.createElement("div");
        card.className = "bus-card";
        card.innerHTML = `
          <div class="bus-info">
            <div class="bus-title">${bus.name || "IIUM Shuttle"}</div>
            <div class="bus-sub">Terminal: ${bus.startTerminal || "Ruqayyah"}</div>
          </div>
          <div class="bus-speed">${bus.speedKmH || 0} km/h</div>
        `;

        card.addEventListener("click", () => {
          if (bus.lat && bus.lng) {
            map.flyTo([bus.lat, bus.lng], 17, { duration: 1.2 });
            if (busMarkers[bus.id]) {
              busMarkers[bus.id].openPopup();
            }
          }
        });

        busListContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
