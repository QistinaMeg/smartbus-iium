<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IIUM Bus Driver Control</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f8fafc; color: #1e293b; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 420px; margin: 0 auto; text-align: left; }
    label { font-weight: bold; font-size: 14px; margin-top: 14px; display: block; color: #475569; }
    select, button { width: 100%; padding: 12px; font-size: 15px; margin-top: 6px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; }
    button.primary { background: #16a34a; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
    button.stop { background: #dc2626; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; display: none; }
    #status { margin-top: 16px; font-weight: bold; font-size: 14px; line-height: 1.4; text-align: center; color: #0284c7; }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="margin-top:0; text-align:center;">🚌 Driver Broadcast</h2>
    
    <label for="busSelect">1. Select Bus Name</label>
    <select id="busSelect">
      <option value="RUQAYYAH">Bus RUQAYYAH</option>
      <option value="SALAHUDDIN">Bus SALAHUDDIN</option>
    </select>

    <label for="occupancySelect">2. Current Bus Occupancy</label>
    <select id="occupancySelect" onchange="updateOccupancyLive()">
      <option value="Seats Available">🟢 Seats Available</option>
      <option value="Standing Room Only">🟡 Standing Room Only</option>
      <option value="Full / Packed">🔴 Full / Packed</option>
    </select>

    <button id="startBtn" class="primary" onclick="startTracking()">Start Route Broadcast</button>
    <button id="stopBtn" class="stop" onclick="stopTracking()">Stop Broadcast & Go Offline</button>
    <p id="status">Status: Offline (Select bus and tap Start)</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDUUEf8fK2pKNGZQOcMnLL5QucEveF28wM",
      authDomain: "smartbus-iium.firebaseapp.com",
      projectId: "smartbus-iium",
      storageBucket: "smartbus-iium.firebasestorage.app",
      messagingSenderId: "920517840888",
      appId: "1:920517840888:web:1e3ce74245408cdf6e500d",
      measurementId: "G-EDHGR3H4X3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let activeBusId = null;
    let watchPositionId = null;

    function updateOccupancyLive() {
      if (!activeBusId) return;
      const occupancy = document.getElementById("occupancySelect").value;
      db.collection("buses").doc(activeBusId).update({ occupancy: occupancy });
    }

    function startTracking() {
      // 1. Route only starts after choosing bus and pressing Start
      activeBusId = document.getElementById("busSelect").value;
      const occupancy = document.getElementById("occupancySelect").value;

      if (!("geolocation" in navigator)) {
        alert("GPS unavailable on this device.");
        return;
      }

      document.getElementById("busSelect").disabled = true;
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("stopBtn").style.display = "block";
      document.getElementById("status").innerText = `Connecting GPS for Bus ${activeBusId}...`;

      watchPositionId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;
          const speedKmH = speed ? Math.round(speed * 3.6) : 0;

          // Push live location to Firestore
          db.collection("buses").doc(activeBusId).set({
            name: activeBusId,
            lat: latitude,
            lng: longitude,
            speedKmH: speedKmH,
            occupancy: occupancy,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          document.getElementById("status").innerText = 
            `Broadcasting: ${activeBusId}\nSpeed: ${speedKmH} km/h | Status: ${occupancy}`;
        },
        (err) => {
          document.getElementById("status").innerText = "GPS Error: " + err.message;
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    function stopTracking() {
      if (watchPositionId !== null) {
        navigator.geolocation.clearWatch(watchPositionId);
        watchPositionId = null;
      }

      // Delete bus document from database on manual stop
      if (activeBusId) {
        db.collection("buses").doc(activeBusId).delete().then(() => {
          document.getElementById("status").innerText = `Offline: Bus ${activeBusId} removed from map.`;
          activeBusId = null;
        });
      }

      document.getElementById("busSelect").disabled = false;
      document.getElementById("startBtn").style.display = "block";
      document.getElementById("stopBtn").style.display = "none";
    }

    // 2. Automatically delete bus document when web browser/tab is closed
    window.addEventListener("beforeunload", () => {
      if (activeBusId) {
        db.collection("buses").doc(activeBusId).delete();
      }
    });
  </script>
</body>
</html>
