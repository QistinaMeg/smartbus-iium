<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IIUM Bus Driver Transmitter</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
    button { padding: 15px 30px; font-size: 18px; background: #22c55e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #status { margin-top: 20px; font-weight: bold; font-size: 16px; line-height: 1.5; }
  </style>
</head>
<body>

  <h2>IIUM Bus Driver Panel</h2>
  <button onclick="startTracking()">Start Route Broadcast</button>
  <p id="status">Status: Offline</p>

  <!-- Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // Your actual Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDUUEf8fK2pKNGZQOcMnLL5QucEveF28wM",
      authDomain: "smartbus-iium.firebaseapp.com",
      projectId: "smartbus-iium",
      storageBucket: "smartbus-iium.firebasestorage.app",
      messagingSenderId: "920517840888",
      appId: "1:920517840888:web:1e3ce74245408cdf6e500d",
      measurementId: "G-EDHGR3H4X3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function startTracking() {
      if (!("geolocation" in navigator)) {
        alert("GPS is not supported on this device/browser.");
        return;
      }

      document.getElementById("status").innerText = "Requesting GPS Access...";

      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;

          db.collection("buses").doc("campus_bus_1").set({
            lat: latitude,
            lng: longitude,
            speed: speed || 0,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          document.getElementById("status").innerText = 
            `Broadcasting Live Location!\nLat: ${latitude.toFixed(5)}, Lng: ${longitude.toFixed(5)}`;
        },
        (err) => {
          document.getElementById("status").innerText = "GPS Error: " + err.message;
        },
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
