<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBus IIUM - Driver Interface</title>

  <!-- Firebase v9 Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h2 {
      font-size: 1.4rem;
      color: #0f172a;
    }

    .header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }

    .status-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .status-badge {
      font-weight: 700;
      font-size: 0.85rem;
      color: #ef4444;
    }

    .status-badge.active {
      color: #16a34a;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      background: #ffffff;
    }

    select:disabled {
      background: #f1f5f9;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-start {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-start:hover {
      background: #1d4ed8;
    }

    .btn-stop {
      background: #dc2626;
      color: #ffffff;
      display: none;
      margin-top: 10px;
    }

    .btn-stop:hover {
      background: #b91c1c;
    }

    .gps-box {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #334155;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>Driver Terminal Broadcasting</h2>
      <p>Select your starting route to initiate tracking</p>
    </div>

    <div class="status-box">
      <span>Status:</span>
      <span class="status-badge" id="driver-status">Offline</span>
    </div>

    <div class="form-group">
      <label for="terminal">Select Starting Route / Terminal:</label>
      <select id="terminal">
        <option value="Ruqayyah" selected>Ruqayyah Terminal (Main Loop)</option>
        <option value="Salahuddin" disabled>Salahuddin Terminal (Disabled)</option>
      </select>
    </div>

    <div id="assigned-name" style="text-align:center; font-weight:bold; margin-bottom:15px; color:#1e293b;"></div>

    <button class="btn btn-start" id="start-btn" onclick="startAutoSession()">Start Route Broadcast</button>
    <button class="btn btn-stop" id="stop-btn" onclick="stopSession()">Stop Route Broadcast</button>

    <div class="gps-box" id="gps-info">GPS inactive. Click Start to broadcast coordinates.</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDUUEf8fK2pKNGZQOcMnLL5QucEveF28wM",
      authDomain: "smartbus-iium.firebaseapp.com",
      projectId: "smartbus-iium",
      storageBucket: "smartbus-iium.firebasestorage.app",
      messagingSenderId: "920517840888",
      appId: "1:920517840888:web:1e3ce74245408cdf6e500d",
      measurementId: "G-EDHGR3H4X3"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let currentBusDocId = null;
    let watchPositionId = null;

    async function startAutoSession() {
      const startBtn = document.getElementById("start-btn");
      const selectedTerminal = document.getElementById("terminal").value;

      if (selectedTerminal === "Salahuddin") {
        alert("Salahuddin route is currently disabled.");
        return;
      }

      startBtn.disabled = true;
      startBtn.innerText = "Connecting...";

      try {
        const snapshot = await db.collection("buses")
          .where("startTerminal", "==", selectedTerminal)
          .get();

        const activeNumbers = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.busNumber) activeNumbers.push(data.busNumber);
        });

        let assignedNumber = 1;
        while (activeNumbers.includes(assignedNumber)) {
          assignedNumber++;
        }

        const autoBusName = `${selectedTerminal} Bus ${assignedNumber}`;
        currentBusDocId = `bus_${selectedTerminal.toLowerCase()}_${assignedNumber}`;

        await db.collection("buses").doc(currentBusDocId).set({
          name: autoBusName,
          startTerminal: selectedTerminal,
          busNumber: assignedNumber,
          lat: 3.2520,
          lng: 101.7345,
          speedKmH: 0,
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById("driver-status").innerText = "Broadcasting Live";
        document.getElementById("driver-status").classList.add("active");
        document.getElementById("assigned-name").innerText = `Assigned: ${autoBusName}`;
        startBtn.style.display = "none";
        document.getElementById("stop-btn").style.display = "block";
        document.getElementById("terminal").disabled = true;

        if ("geolocation" in navigator) {
          watchPositionId = navigator.geolocation.watchPosition((pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const speedKmH = Math.round((pos.coords.speed || 0) * 3.6);

            document.getElementById("gps-info").innerText = `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)} | Speed: ${speedKmH} km/h`;

            db.collection("buses").doc(currentBusDocId).update({
              lat: lat,
              lng: lng,
              speedKmH: speedKmH,
              lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(e => console.error("Update error:", e));
          }, (err) => {
            alert("GPS Error: " + err.message + ". Ensure location permissions are allowed in your browser.");
          }, { enableHighAccuracy: true, maximumAge: 0 });
        } else {
          alert("Geolocation is not supported by your browser.");
        }

      } catch (error) {
        console.error("Broadcast Start Error:", error);
        alert("Broadcast failed: " + error.message);
        startBtn.disabled = false;
        startBtn.innerText = "Start Route Broadcast";
      }
    }

    async function stopSession() {
      if (watchPositionId) {
        navigator.geolocation.clearWatch(watchPositionId);
      }

      if (currentBusDocId) {
        try {
          await db.collection("buses").doc(currentBusDocId).delete();
        } catch (e) {
          console.error("Delete error:", e);
        }
      }

      document.getElementById("driver-status").innerText = "Offline";
      document.getElementById("driver-status").classList.remove("active");
      document.getElementById("assigned-name").innerText = "";
      
      const startBtn = document.getElementById("start-btn");
      startBtn.disabled = false;
      startBtn.innerText = "Start Route Broadcast";
      startBtn.style.display = "block";
      
      document.getElementById("stop-btn").style.display = "none";
      document.getElementById("terminal").disabled = false;
      document.getElementById("gps-info").innerText = "GPS inactive. Click Start to broadcast coordinates.";
    }
  </script>
</body>
</html>
